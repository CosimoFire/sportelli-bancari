<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depositi bancari delle famiglie per provincia – Radar QN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../assets/radar.js"></script>
<style>
  .viste { display: inline-flex; margin: 22px 0 0; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
  .viste button {
    font: 600 13px var(--sans); color: var(--ink-2); background: transparent; border: 0; padding: 8px 14px; cursor: pointer;
  }
  .viste button + button { border-left: 1px solid var(--rule); }
  .viste button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .scala { margin: 18px 0 4px; }
  .scala svg { display: block; overflow: visible; }
  .prov { stroke: var(--bg); stroke-width: 0.5px; stroke-linejoin: round; transition: opacity 180ms ease; }
  /* prime e ultime 3 della vista: contorno pieno o tratteggiato */
  .evidenze path { fill: none; stroke: var(--ink); stroke-width: 2px; stroke-linejoin: round; pointer-events: none; }
  .evidenze path.trat { stroke-dasharray: 4 2.5; }
  .evidenze path.hover { stroke-width: 1.5px; stroke-dasharray: none; }
  .estremi { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
  .estremi span { display: inline-flex; align-items: center; gap: 7px; }
  .ragno text { font-size: 12.5px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; font-variant-numeric: tabular-nums; }
  .ragno text.nome { font-weight: 600; }
  .ragno .filo { fill: none; stroke: var(--ink); stroke-width: 0.75px; }
  .ragno .filo.trat { stroke-dasharray: 2 2; }
  .ragno circle { fill: var(--ink); }
  @media (max-width: 519px) { .ragno text { font-size: 11px; } }
  .estremi .anello { width: 12px; height: 12px; border-radius: 2px; border: 2px solid var(--ink); box-sizing: border-box; }
  .estremi .anello.trat { border-style: dashed; }
</style>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">Quanto tengono in banca le famiglie, provincia per provincia</h1>
    <p class="r-sub" id="sub">Depositi bancari delle famiglie consumatrici a fine 2025</p>
  </header>

  <div class="viste" role="group" aria-label="Scegli la vista">
    <button type="button" data-vista="pc" aria-pressed="true">Euro per abitante</button>
    <button type="button" data-vista="var" aria-pressed="false">Variazione sul 2024</button>
  </div>

  <div class="scala" id="scala"></div>
  <div class="estremi" id="estremi" aria-live="polite"></div>
  <figure class="r-chart" id="mappa" style="margin-top:8px"></figure>

  <footer class="r-foot">
    <span>Fonte: Banca d'Italia (TDB20290, depositi al 31 dicembre); Istat, popolazione al 1° gennaio</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;
  var VISTE = {
    pc: {
      sub: "Depositi bancari delle famiglie consumatrici per abitante a fine 2025, in euro",
      val: function (d) { return d.pc25; }, lab: function (v) { return fmt(v / 1000, 1); },
      full: function (v) { return fmt(Math.round(v / 100) * 100, 0) + " euro"; },
      ticks: [10000, 15000, 20000, 25000, 30000], tick: function (v) { return fmt(v, 0); },
      dom: [9000, 31000], diverging: false
    },
    var: {
      sub: "Variazione % dei depositi bancari delle famiglie consumatrici per abitante, fine 2025 su fine 2024",
      val: function (d) { return d.v; }, lab: function (v) { return (v > 0 ? "+" : "") + fmt(v, 1); },
      full: function (v) { return (v > 0 ? "+" : "") + fmt(v, 1) + "%"; },
      ticks: [-6, -3, 0, 3, 6], tick: function (v) { return (v > 0 ? "+" : "") + fmt(v, 0) + "%"; },
      dom: [-6, 0, 6], diverging: true
    }
  };
  var vista = "pc";

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function scala(cfg) {
    if (!cfg.diverging) {
      var c = d3.piecewise(d3.interpolateRgb, ["--blue-5", "--blue-4", "--blue-3", "--blue-2", "--blue-1"].map(css));
      return function (v) { return c(Math.max(0, Math.min(1, (v - cfg.dom[0]) / (cfg.dom[1] - cfg.dom[0])))); };
    }
    // divergente: rosso sotto lo zero, grigio chiaro al centro, blu sopra
    var neg = d3.piecewise(d3.interpolateRgb, [css("--red-2"), css("--red-4"), css("--grey-5")]);
    var pos = d3.piecewise(d3.interpolateRgb, [css("--grey-5"), css("--blue-4"), css("--blue-2"), css("--blue-1")]);
    return function (v) {
      return v < 0 ? neg(Math.max(0, Math.min(1, 1 - v / cfg.dom[0]))) : pos(Math.max(0, Math.min(1, v / cfg.dom[2])));
    };
  }
  function scuro(col) { var c = d3.rgb(col); return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255 < 0.5; }

  Promise.all([R.loadCSV("../data/depositi-province.csv"), d3.json("../data/province.geojson")]).then(function (res) {
    var it = null, bySig = {};
    res[0].forEach(function (r) {
      var d = {
        sig: r["Sigla"], nome: r["Provincia"].split("/")[0].replace("Valle d'Aosta", "Aosta"), reg: r["Regione"].split("/")[0],
        dep: R.num(r["Depositi famiglie consumatrici 31/12/2025 (euro)"]),
        pc25: R.num(r["Depositi pro capite 2025 (euro)"]), pc24: R.num(r["Depositi pro capite 2024 (euro)"]),
        v: R.num(r["Variazione % pro capite 2024-2025"])
      };
      if (d.sig === "IT") it = d; else bySig[d.sig] = d;
    });
    var geo = res[1];
    // ogni provincia del file dei confini prende i suoi dati (stessa sigla)
    geo.features.forEach(function (f) { f.d = bySig[f.properties.sigla]; });
    var feats = geo.features.filter(function (f) { return f.d; });
    var prov = feats.map(function (f) { return f.d; });

    var host = document.getElementById("mappa"), tip = R.tooltip(host), paths, evid, path;
    function spegni() { if (paths) paths.classed("is-dimmed", false); if (evid) evid.selectAll(".hover").remove(); }
    R.dismissOutside(host, function () { tip.hide(); spegni(); });

    function tipFor(d) {
      return R.tipHTML({
        title: d.nome + " (" + d.sig + ")", value: fmt(Math.round(d.pc25 / 100) * 100, 0), unit: "euro per abitante",
        rows: [["Fine 2024", fmt(Math.round(d.pc24 / 100) * 100, 0) + " euro"],
               ["Variazione", (d.v > 0 ? "+" : "") + fmt(d.v, 1) + "%"],
               ["Depositi totali", fmt(d.dep / 1e9, 2) + " miliardi"]],
        note: d.reg
      });
    }

    // prime e ultime 3 province della vista corrente: contorno sulla mappa ed etichetta con linea di richiamo
    var geom = null;   // {W, H, mx}: larghezza, altezza e asse centrale della mappa, aggiornati a ogni disegno
    function estremi(cfg) {
      var ord = prov.slice().sort(function (a, b) { return cfg.val(b) - cfg.val(a); });
      var top = ord.slice(0, 3), bot = ord.slice(-3).reverse();
      var lab = vista === "pc" ? ["Le 3 con più depositi", "Le 3 con meno depositi"] : ["Le 3 con la crescita più alta", "Le 3 con la crescita più bassa"];
      d3.select("#estremi").html('<span><i class="anello"></i>' + lab[0] + '</span><span><i class="anello trat"></i>' + lab[1] + "</span>");
      if (!evid || !geom) return;
      var sel = feats.filter(function (f) { return top.indexOf(f.d) >= 0 || bot.indexOf(f.d) >= 0; });
      evid.selectAll("path.evid").data(sel, function (f) { return f.d.sig; }).join("path").attr("class", "evid")
        .attr("d", path).classed("trat", function (f) { return bot.indexOf(f.d) >= 0; });

      // etichette nei margini: a sinistra le province a ovest dell'asse centrale, a destra le altre
      var narrow = geom.W < 520, LH = narrow ? 30 : 34;
      var items = sel.map(function (f) {
        var c = path.centroid(f);
        return { f: f, cx: c[0], cy: c[1], left: c[0] < geom.mx, y: c[1], trat: bot.indexOf(f.d) >= 0 };
      });
      [true, false].forEach(function (lato) {
        var g = items.filter(function (it) { return it.left === lato; }).sort(function (a, b) { return a.cy - b.cy; });
        // niente sovrapposizioni: si scende di almeno LH, poi si risale se si esce dal fondo
        for (var i = 1; i < g.length; i++) g[i].y = Math.max(g[i].y, g[i - 1].y + LH);
        var over = g.length ? g[g.length - 1].y - (geom.H - 14) : 0;
        if (over > 0) g.forEach(function (it) { it.y -= over; });
        for (i = g.length - 2; i >= 0; i--) g[i].y = Math.min(g[i].y, g[i + 1].y - LH);
        g.forEach(function (it) { it.y = Math.max(16, it.y); });
      });
      var lx = function (it) { return it.left ? 2 : geom.W - 2; };
      var lab2 = evid.selectAll("g.ragno").data(items, function (it) { return it.f.d.sig; }).join(function (e) {
        var g = e.append("g").attr("class", "ragno");
        g.append("path").attr("class", "filo");
        g.append("circle").attr("r", 1.75);
        g.append("text").attr("class", "nome");
        g.append("text").attr("class", "valore");
        return g;
      });
      lab2.each(function (it) {
        var g = d3.select(this), x = lx(it), anchor = it.left ? "start" : "end";
        var tx = g.select(".nome").attr("x", x).attr("y", it.y - 3).attr("text-anchor", anchor).text(it.f.d.nome);
        g.select(".valore").attr("x", x).attr("y", it.y + 12).attr("text-anchor", anchor).text(cfg.full(cfg.val(it.f.d)));
        var bw = Math.max(tx.node().getComputedTextLength(), g.select(".valore").node().getComputedTextLength());
        var ex = it.left ? x + bw + 5 : x - bw - 5;      // bordo dell'etichetta verso la mappa
        g.select(".filo").attr("d", "M" + ex + "," + (it.y + 1) + "H" + (it.left ? Math.min(ex + 8, it.cx) : Math.max(ex - 8, it.cx)) + "L" + it.cx + "," + it.cy)
          .classed("trat", it.trat);
        g.select("circle").attr("cx", it.cx).attr("cy", it.cy);
      });
    }

    function legenda(W, cfg, col) {
      var lw = Math.min(320, W - 20), lh = 10;
      var x = d3.scaleLinear().domain([cfg.dom[0], cfg.dom[cfg.dom.length - 1]]).range([0, lw]);
      d3.select("#scala").selectAll("*").remove();
      var svg = d3.select("#scala").append("svg").attr("width", lw + 20).attr("height", 52).attr("aria-hidden", "true");
      var id = "grad-" + vista, g = svg.append("defs").append("linearGradient").attr("id", id);
      d3.range(0, 1.0001, 0.05).forEach(function (t) {
        g.append("stop").attr("offset", t).attr("stop-color", col(x.invert(t * lw)));
      });
      svg.append("rect").attr("x", 0).attr("y", 20).attr("width", lw).attr("height", lh).attr("rx", 2).attr("fill", "url(#" + id + ")");
      cfg.ticks.forEach(function (t, i) {
        svg.append("line").attr("x1", x(t)).attr("x2", x(t)).attr("y1", 20 + lh).attr("y2", 34).style("stroke", "var(--ink-2)").attr("stroke-width", 0.75);
        svg.append("text").attr("class", "tick-label").attr("x", x(t)).attr("y", 47)
          .attr("text-anchor", i === 0 ? "start" : i === cfg.ticks.length - 1 ? "end" : "middle").text(cfg.tick(t));
      });
      var iv = cfg.val(it), ix = x(iv);
      svg.append("path").attr("d", "M" + ix + ",18L" + (ix - 4) + ",11H" + (ix + 4) + "Z").style("fill", "var(--ink)");
      svg.append("text").attr("class", "series-label").attr("x", ix + 7).attr("y", 14).style("font-size", "12px")
        .text("Italia " + cfg.full(iv));
    }

    R.responsive(host, function (W, phase) {
      var cfg = VISTE[vista], col = scala(cfg);
      d3.select("#sub").text(cfg.sub);
      legenda(W, cfg, col);
      var H = Math.round(W * 1.16);
      // margini laterali per le etichette con linea di richiamo
      var M = W < 520 ? 74 : 118;
      var proj = d3.geoConicConformal().parallels([38, 46]).rotate([-12.5, 0]).fitExtent([[M, 4], [W - M, H - 4]], geo);
      // asse che divide le etichette: a ovest di 13,2° E (Trapani compresa) vanno a sinistra
      geom = { W: W, H: H, mx: proj([13.2, 42])[0] };
      path = d3.geoPath(proj);
      d3.select(host).select("svg").remove();
      var svg = d3.select(host).insert("svg", ".r-tip").attr("width", W).attr("height", H).attr("role", "img")
        .attr("aria-label", vista === "pc"
          ? "Mappa delle province: depositi delle famiglie per abitante a fine 2025, da " + VISTE.pc.full(d3.min(prov, cfg.val)) + " a " + VISTE.pc.full(d3.max(prov, cfg.val)) + "."
          : "Mappa delle province: variazione dei depositi per abitante sul 2024, da " + VISTE.var.full(d3.min(prov, cfg.val)) + " a " + VISTE.var.full(d3.max(prov, cfg.val)) + ".");
      paths = svg.append("g").selectAll("path").data(feats).join("path").attr("class", "prov mark").attr("d", path);
      R.enter(paths, phase,
        function (s) { s.style("fill", "var(--grey-5)"); },
        function (s) { s.style("fill", function (f) { return col(cfg.val(f.d)); }); });
      evid = svg.append("g").attr("class", "evidenze");
      paths.on("pointerenter pointerdown", function (ev, f) {
        paths.classed("is-dimmed", function (q) { return q !== f; });
        evid.selectAll(".hover").remove();
        evid.append("path").attr("class", "hover").attr("d", path(f));
        var c = path.centroid(f);
        tip.show(tipFor(f.d), c[0], c[1]);
      }).on("pointerleave", function (ev) {
        if (ev.pointerType === "mouse") { tip.hide(); spegni(); }
      });
      estremi(cfg);
    });

    // cambio vista: ridisegna con un passaggio di colore
    d3.selectAll(".viste button").on("click", function () {
      var v = this.getAttribute("data-vista");
      if (v === vista) return;
      vista = v;
      d3.selectAll(".viste button").attr("aria-pressed", function () { return this.getAttribute("data-vista") === vista; });
      var cfg = VISTE[vista], col = scala(cfg), W = Math.floor(host.getBoundingClientRect().width);
      d3.select("#sub").text(cfg.sub);
      legenda(W, cfg, col);
      paths.transition().duration(R.reduced ? 0 : 450).style("fill", function (f) { return col(cfg.val(f.d)); });
      estremi(cfg);
    });

    // le scale si calcolano dalle variabili del tema: se cambiano sfondo o tema, si ricolora
    new MutationObserver(function () {
      if (!paths) return;
      var cfg = VISTE[vista], col = scala(cfg), W = Math.floor(host.getBoundingClientRect().width);
      legenda(W, cfg, col);
      paths.interrupt().style("fill", function (f) { return col(cfg.val(f.d)); });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "data-bg"] });
  }).catch(function (e) { R.fail("#mappa", e); });
})();
</script>
</body>
</html>
